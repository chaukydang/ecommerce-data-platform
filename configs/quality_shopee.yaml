volume_change_pct: 100
datasets:
  - dataset: raw_shopee.orders
    source: shopee
    entity: orders
    pk_unique: [order_id]
    required: [order_id, channel, status, total_amount, currency, created_at]
    accepted_values:
      status: [PENDING, PAID, SHIPPED, COMPLETED, CANCELLED]
    non_negative: [total_amount]
    severity: CRITICAL
  - dataset: raw_shopee.payments
    source: shopee
    entity: payments
    pk_unique: [payment_id]
    required: [payment_id, order_id, payment_ref, amount, currency]
    non_negative: [amount]
    relationships:
      - {column: order_id, to: raw_shopee.orders, to_column: order_id}
    severity: CRITICAL
  - dataset: raw_shopee.settlements
    source: shopee
    entity: settlements
    pk_unique: [settlement_id]
    required: [settlement_id, order_id, gross_amount, net_payout]
    relationships:
      - {column: order_id, to: raw_shopee.orders, to_column: order_id}
    severity: WARNING
