datasets:
  - dataset: raw_omni.orders
    source: omni
    entity: orders
    pk_unique: [order_id]
    required: [order_id, channel, status, currency, created_at]
    accepted_values:
      status: [PENDING, PAID, SHIPPED, COMPLETED, CANCELLED]
    non_negative: [total_amount]
    severity: CRITICAL
  - dataset: raw_omni.payments
    source: omni
    entity: payments
    pk_unique: [payment_id]
    required: [payment_id, order_id, payment_ref, amount, currency]
    non_negative: [amount]
    relationships:
      - {column: order_id, to: raw_omni.orders, to_column: order_id}
    severity: CRITICAL
  - dataset: raw_omni.refunds
    source: omni
    entity: refunds
    pk_unique: [refund_id]
    required: [refund_id, order_id, refund_ref, amount, currency]
    non_negative: [amount]
    severity: CRITICAL
