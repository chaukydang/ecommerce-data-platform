# Profile "omni": simulated multi-channel demo (orders, payments, refunds). No OMS or settlement data.
base: reconciliation_rules.yaml
tables:
  marketplace_orders: raw_omni.orders
  payments: raw_omni.payments
  refunds: raw_omni.refunds
  oms_orders: raw_omni_stub.orders
  settlements: raw_omni.settlements
disable: [ORD_MISSING_IN_OMS, OMS_DUPLICATE_ORDER, ORD_AMOUNT_MISMATCH, SETTLE_MISSING, SETTLE_FORMULA_MISMATCH, SETTLE_GROSS_MISMATCH]
volume_change_pct: 100
