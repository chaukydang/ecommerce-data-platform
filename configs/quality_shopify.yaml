volume_change_pct: 100
datasets:
  - dataset: raw_shopify.orders
    source: shopify
    entity: orders
    pk_unique: [order_id]
    required: [order_id, channel, status, total_amount, currency, created_at]
    accepted_values:
      status: [PENDING, PAID, SHIPPED, COMPLETED, CANCELLED]
    non_negative: [total_amount]
    severity: CRITICAL
  - dataset: raw_shopify.payments
    source: shopify
    entity: payments
    pk_unique: [payment_id]
    required: [payment_id, order_id, payment_ref, amount, currency]
    non_negative: [amount]
    relationships:
      - {column: order_id, to: raw_shopify.orders, to_column: order_id}
    severity: CRITICAL
  - dataset: raw_shopify.refunds
    source: shopify
    entity: refunds
    pk_unique: [refund_id]
    required: [refund_id, order_id, refund_ref, amount]
    non_negative: [amount]
    relationships:
      - {column: order_id, to: raw_shopify.orders, to_column: order_id}
    severity: WARNING
